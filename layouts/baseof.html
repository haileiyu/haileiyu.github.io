<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default `en` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{/* Nav sits outside the content column, flush to the viewport edge —
       the two are deliberately not aligned. See notes in main.css. */}}
  {{ partial "nav.html" . }}

  <div class="wrap {{ block "width" . }}wrap--text{{ end }}">
    {{ block "main" . }}{{ end }}
  </div>
</body>
</html>
